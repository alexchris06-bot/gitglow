<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitGlow - GitHub Commit Visualizer</title>

    <!-- Font Inter khas UI Modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --gh-green: #238636;
            --gh-green-hover: #2ea043;
            --gh-accent: #3fb950;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header & Branding */
        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .badge {
            background: rgba(63, 185, 80, 0.15);
            color: var(--gh-accent);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(63, 185, 80, 0.3);
            vertical-align: middle;
        }

        /* Search Box Card */
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
        }

        .search-card input {
            flex: 1;
            background: #010409;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-card input:focus {
            border-color: #58a6ff;
        }

        .search-card button {
            background-color: var(--gh-green);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-card button:hover {
            background-color: var(--gh-green-hover);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            display: none;
            /* Muncul otomatis saat ada data */
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px 20px;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 6px;
        }

        /* Chart Container Card */
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
            display: none;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Recent Commits List */
        .commits-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .commits-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .commit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
        }

        .commit-item:last-child {
            border-bottom: none;
        }

        .commit-msg {
            font-weight: 500;
            font-size: 0.9rem;
            color: #58a6ff;
        }

        .commit-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .commit-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: #21262d;
            padding: 4px 10px;
            border-radius: 6px;
        }

        #loadingText {
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>✨ GitGlow <span class="badge">v1.0</span></h1>
            <p>Visualisator aktivitas commit GitHub dengan gaya dark mode elegan</p>
        </header>

        <!-- Search Box -->
        <div class="search-card">
            <input type="text" id="repoInput"
                placeholder="Ketik username/repository (contoh: alexchris06-bot/SaringPesan)">
            <button onclick="fetchCommits()">Visualisasikan</button>
        </div>

        <!-- Status Loading / Error -->
        <div id="loadingText">Sedang menarik data dari GitHub API...</div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">Total Commit Terambil</div>
                <div class="value" id="statTotalCommits">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Hari Aktif Koding</div>
                <div class="value" id="statActiveDays">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Commit Terakhir</div>
                <div class="value" id="statLastDate" style="font-size: 1.1rem; padding-top: 6px;">-</div>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="chart-card" id="chartCard">
            <div class="chart-header">
                <div class="chart-title" id="chartTitle">Aktivitas Commit</div>
            </div>
            <canvas id="commitChart"></canvas>
        </div>

        <!-- Recent Commits Timeline -->
        <div class="commits-card" id="commitsCard">
            <h3>📌 Commit Terbaru</h3>
            <div id="commitsList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
