<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitGlow - Animated Commit Visualizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --gh-green: #238636;
            --gh-accent: #3fb950;
            --gh-cyan: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        /* Search Box */
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-card input {
            flex: 1;
            background: #010409;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-card button {
            background-color: var(--gh-green);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
            display: none;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Interactive Player Controls */
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .play-btn {
            background: var(--gh-green);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-slider {
            width: 100%;
            accent-color: var(--gh-accent);
            cursor: pointer;
        }

        .current-commit-box {
            background: #010409;
            border: 1px dashed var(--card-border);
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--gh-accent);
        }

        /* Charts Row */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            display: none;
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .chart-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        #loadingText {
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>✨ GitGlow Replay</h1>
            <p>Simulasikan dan putar ulang garis waktu perkembangan kodinganmu</p>
        </header>

        <div class="search-card">
            <input type="text" id="repoInput"
                placeholder="Ketik username/repository (contoh: alexchris06-bot/SaringPesan)">
            <button onclick="fetchData()">Muat Visualisasi</button>
        </div>

        <div id="loadingText">Sedang mengunduh data riwayat dari GitHub API...</div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">Total Commit</div>
                <div class="value" id="statCommits">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Bahasa Utama</div>
                <div class="value" id="statLanguage" style="font-size: 1.1rem; padding-top: 6px;">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Tanggal Dibuat</div>
                <div class="value" id="statCreated" style="font-size: 1rem; padding-top: 6px;">-</div>
            </div>
        </div>

        <!-- Controls Replay -->
        <div class="player-card" id="playerCard">
            <div class="player-header">
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶ Play Replay</button>
                <span style="font-size: 0.85rem; color: var(--text-muted);" id="stepIndicator">Commit 0 / 0</span>
            </div>
            <input type="range" id="timelineSlider" class="timeline-slider" min="0" max="0" value="0"
                oninput="onSliderChange(this.value)">
            <div class="current-commit-box" id="commitBox">Tekan tombol Play untuk memulai simulasi pertumbuhan kode...
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid" id="chartsGrid">
            <div class="chart-card">
                <div class="chart-title">📈 Kurva Akumulasi Commit</div>
                <canvas id="growthChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">📊 Tech Stack</div>
                <canvas id="langChart"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
